version: "3.8"

services:
  # ==========================================
  # 🐬 MySQL Database Service
  # ==========================================
  db:
    image: mysql:8.0
    container_name: quizora-db
    restart: always
    environment:
      MYSQL_DATABASE: quizdb
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - quizapp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # ☕ Spring Boot Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend/quizapp-backend
      dockerfile: Dockerfile
    container_name: quizora-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/quizdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      JWT_SECRET: ${JWT_SECRET:-mysecretkeymysecretkeymysecretkey32charsmin}
      PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - quizapp-network

  # ==========================================
  # ⚛️ React + Nginx Frontend Service
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quizora-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - quizapp-network

volumes:
  mysql_data:
    driver: local

networks:
  quizapp-network:
    driver: bridge
