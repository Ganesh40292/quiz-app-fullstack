# ===============================
# DATABASE CONFIGURATION (MySQL / Aiven / Local)
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quizdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ganesh}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER CONFIG
# ===============================
server.port=${PORT:8080}

# ===============================
# JWT SECURITY CONFIG
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey32charsmin}

# ===============================
# GOOGLE OAUTH SECURITY
# ===============================
google.client.id=${GOOGLE_CLIENT_ID:349278238147-e2j6a56t4kfqgqlvsq9iq4dodm4j0b4m.apps.googleusercontent.com}

# ===============================
# LOGGING (optional)
# ===============================
logging.level.org.springframework=INFO

# ===============================
# OPEN-IN-VIEW OPTIMIZATION
# ===============================
spring.jpa.open-in-view=false

# ===============================
# HIKARICP CONNECTION POOL CONFIG
# ===============================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:3}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=QuizoraHikariPool

# ===============================
# ACTUATOR & MONITORING CONFIG
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always